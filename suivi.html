<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12305E">
<title>Suivi de votre linge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:14px}
.big-st{font-size:28px;font-weight:800;letter-spacing:-.02em}
.foot{text-align:center;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="root"><p class="muted">Chargement…</p></div>
<script type="module">
import { sb, $, esc, fmt, money, fmtPhone, waLink, dayLabel, dateTime, ticketNo, STATUS, STEPS, I } from './assets/core.js';
const root = $('#root');
const token = new URLSearchParams(location.search).get('t') || '';
const TEXT = {
  recu: 'Votre linge a bien été déposé. Il passera bientôt au lavage.',
  lavage: 'Votre linge est en cours de lavage et de repassage.',
  pret: 'Votre linge est prêt ! Vous pouvez passer le récupérer.',
  retire: 'Votre linge a été récupéré. Merci de votre confiance !',
  annule: 'Ce ticket a été annulé. Contactez le pressing pour plus d’informations.'
};
(async () => {
  const { data, error } = token.length >= 24 ? await sb.rpc('track_order', { p_token: token }) : { data: null };
  if (error || !data) {
    root.innerHTML = '<div class="card empty"><b>Ticket introuvable</b>Vérifiez le lien reçu par WhatsApp ou scannez à nouveau le QR code de votre ticket.</div>';
    return;
  }
  const o = data, st = STATUS[o.status], idx = STEPS.indexOf(o.status), rest = o.total - o.paid;
  document.title = 'Ticket ' + ticketNo(o.number) + ' · ' + o.pressing;
  root.innerHTML =
    '<div class="hstack"><span class="logo">' + I.logo + '</span><div><div class="brandname">' + esc(o.pressing) + '</div><div class="brandsub">' + esc(o.address || '') + '</div></div></div>' +
    '<section class="card stack"><div class="hstack" style="justify-content:space-between"><span class="muted">Ticket ' + ticketNo(o.number) + (o.customer ? ' · ' + esc(o.customer) : '') + '</span><span class="badge ' + st.c + '">' + st.l + '</span></div>' +
      '<div class="big-st">' + (o.status === 'pret' ? 'Prêt à récupérer' : st.l) + '</div><p style="margin:0">' + TEXT[o.status] + '</p>' +
      (o.status !== 'annule' ? '<div class="steps">' + STEPS.map((s, i) => '<div class="st' + (i < idx ? ' done' : '') + (i === idx ? ' cur' : '') + '"><i></i>' + STATUS[s].l + '</div>').join('') + '</div>' : '') +
      (o.due_at && (o.status === 'recu' || o.status === 'lavage') ? '<p class="hint">Prévu pour le <b>' + esc(dayLabel(o.due_at)) + '</b>' + (o.express ? ' (express)' : '') + '.</p>' : '') +
    '</section>' +
    '<section class="card"><div class="sec-t" style="margin-bottom:6px">Vos articles</div>' +
      o.items.map(i => '<div class="kv"><span>' + esc(i.name) + '</span><b>× ' + i.qty + '</b></div>').join('') +
      '<div style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><div class="kv"><span class="muted">Total</span><b>' + money(o.total) + '</b></div>' +
      '<div class="kv"><span class="muted">Déjà payé</span><b class="paid">' + money(o.paid) + '</b></div>' +
      (o.status !== 'annule' ? '<div class="kv big"><span>Reste à payer</span><span class="' + (rest > 0 ? 'due' : 'paid') + '">' + money(rest) + '</span></div>' : '') + '</div></section>' +
    '<section class="card stack"><div class="sec-t">Le pressing</div>' +
      (o.hours ? '<div class="hstack"><span style="width:20px;height:20px;color:var(--muted)">' + I.clock + '</span>Ouvert ' + esc(o.hours) + '</div>' : '') +
      (o.phone ? '<div class="hstack"><a class="btn" href="tel:' + esc(o.phone.replace(/\D/g, '')) + '">' + I.phone + ' Appeler</a><a class="btn wa" href="' + esc(waLink(o.phone, 'Bonjour, je vous écris pour mon ticket ' + ticketNo(o.number) + '.')) + '" target="_blank" rel="noopener">' + I.wa + ' WhatsApp</a></div>' : '') +
    '</section>' +
    '<p class="foot">Suivi fourni par <a href="./">Pressing Pro</a></p>';
})();
</script>
</body>
</html>
